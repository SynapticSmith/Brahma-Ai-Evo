<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Brahma Evo - Background</title>
<style>
  html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: radial-gradient(circle at 50% 42%, #111a2b 0%, #070a12 45%, #020306 100%);
    color: #dfe9f5;
    font-family: "Segoe UI", system-ui, sans-serif;
  }
  #stage { position: fixed; inset: 0; }
  canvas { display: block; }
  #overlay {
    position: fixed; inset: 0; display: none;
    align-items: center; justify-content: center;
    background: rgba(2, 3, 6, 0.86);
    padding: 28px; box-sizing: border-box; text-align: center;
  }
  #overlay.show { display: flex; }
  #overlay .card {
    max-width: 620px; border: 1px solid rgba(120, 170, 230, 0.28);
    border-radius: 12px; padding: 20px 22px;
    background: rgba(10, 16, 26, 0.92);
    box-shadow: 0 18px 60px rgba(0, 0, 0, 0.5);
  }
  #overlay h2 { margin: 0 0 8px; font-size: 15px; letter-spacing: .04em; }
  #overlay p { margin: 0; font-size: 12px; line-height: 1.55; color: #9fb2c7; }
  #overlay code {
    display: block; margin-top: 10px; font-size: 10.5px; word-break: break-all;
    color: #7f93a8; background: rgba(255,255,255,0.04); padding: 8px; border-radius: 6px;
  }
  #hint {
    position: fixed; left: 14px; bottom: 12px; font-size: 10.5px;
    color: rgba(160, 185, 210, 0.5); letter-spacing: .06em; text-transform: uppercase;
  }
</style>
<script type="importmap">
{
  "imports": {
    "three": "../avatar_vrm/vendor/three.module.js",
    "three/addons/": "../avatar_vrm/vendor/addons/"
  }
}
</script>
</head>
<body>
<div id="stage"></div>
<div id="overlay"><div class="card">
  <h2 id="err-title">Background could not be loaded</h2>
  <p id="err-body"></p>
  <code id="err-url"></code>
</div></div>
<div id="hint"></div>

<script type="module">
import * as THREE from "three";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
import { HDRLoader } from "./vendor/HDRLoader.js";

// ---------------------------------------------------------------------------
// Emotion vocabulary. These are the canonical tags avatar_runtime normalises
// to; anything else is refused into NEUTRAL rather than guessed at.
// ---------------------------------------------------------------------------
const EMOTION_PROFILES = {
  NEUTRAL:  { hot: 0xffffff, mid: 0xebf5ff, dim: 0x90b5d8, energy: 1.00, audio: 1.00 },
  JOY:      { hot: 0xfff3b0, mid: 0xffd54f, dim: 0xffab00, energy: 1.45, audio: 1.35 },
  SORROW:   { hot: 0xb0c8ff, mid: 0x5c7bd9, dim: 0x2b3f77, energy: 0.62, audio: 0.70 },
  ANGER:    { hot: 0xffb3a0, mid: 0xff3b30, dim: 0x7a0f0a, energy: 1.70, audio: 1.60 },
  FUN:      { hot: 0xffd6f5, mid: 0xff66cc, dim: 0xb02a8c, energy: 1.55, audio: 1.45 },
  SURPRISE: { hot: 0xe0ffff, mid: 0x00e5ff, dim: 0x0077aa, energy: 1.95, audio: 1.80 },
  THINKING: { hot: 0xffe0b3, mid: 0xffb74d, dim: 0x8d6e35, energy: 0.85, audio: 1.00 },
  SMILE:    { hot: 0xffffff, mid: 0xd6ffe9, dim: 0x4fbf8f, energy: 1.20, audio: 1.15 },
  CALM:     { hot: 0xf2fbff, mid: 0xa8d8ff, dim: 0x3f6d9d, energy: 0.78, audio: 0.92 },
  EXCITED:  { hot: 0xfff0a8, mid: 0xffcb2e, dim: 0xb26a00, energy: 2.05, audio: 1.70 },
  CONFUSED: { hot: 0xeae0ff, mid: 0xb59cff, dim: 0x5a479a, energy: 1.05, audio: 1.05 },
  LOVE:     { hot: 0xffe4f0, mid: 0xff7fb5, dim: 0xb03a72, energy: 1.35, audio: 1.20 },
  TIRED:    { hot: 0xdfe6ee, mid: 0x9aa7b6, dim: 0x4a5563, energy: 0.55, audio: 0.85 },
};

// How each assistant state moves the scene. Deliberately small numbers: a
// background should breathe, not distract from the reply.
const STATE_MOTION = {
  IDLE:      { speed: 0.10, exposure: 1.00 },
  ONLINE:    { speed: 0.12, exposure: 1.01 },
  LISTENING: { speed: 0.30, exposure: 1.04 },
  THINKING:  { speed: 0.46, exposure: 1.02 },
  EXECUTING: { speed: 0.40, exposure: 1.06 },
  WORKING:   { speed: 0.40, exposure: 1.06 },
  SPEAKING:  { speed: 0.26, exposure: 1.08 },
  SCANNING:  { speed: 0.36, exposure: 1.03 },
  MUTED:     { speed: 0.03, exposure: 0.90 },
  CINEMATIC: { speed: 0.08, exposure: 0.96 },
  ERROR:     { speed: 0.04, exposure: 0.88 },
};

const MOOD_HOLD_SECONDS = 6.0;

// ---------------------------------------------------------------------------
// State
// ---------------------------------------------------------------------------
let renderer = null, scene = null, camera = null;
let mode = "";                 // "scene" | "panorama"
let modelRoot = null;
let keyLight = null, rimLight = null, fillLight = null;
let baseDistance = 6, modelRadius = 1;
let paused = false, ready = false, loadFailed = false;
let currentState = "IDLE";
let targetEmotion = "NEUTRAL", currentEmotion = "NEUTRAL";
let emotionWeight = 0, moodHold = 0;
let emotionIntensity = 1.0;
let audioLevel = 0, smoothedAudio = 0;
let pointerX = 0, pointerY = 0, smoothPointerX = 0, smoothPointerY = 0;
let speedTarget = STATE_MOTION.IDLE.speed, speedNow = STATE_MOTION.IDLE.speed;
let exposureTarget = 1.0, exposureNow = 1.0;
const clock = new THREE.Clock();
let elapsed = 0;
let backgroundTexture = null;
let currentColor = { hot: new THREE.Color(0xffffff), mid: new THREE.Color(0xebf5ff) };

const stage = document.getElementById("stage");
const overlay = document.getElementById("overlay");
const errTitle = document.getElementById("err-title");
const errBody = document.getElementById("err-body");
const errUrl = document.getElementById("err-url");
const hint = document.getElementById("hint");

function fail(title, message, url) {
  loadFailed = true;
  ready = false;
  errTitle.textContent = title;
  errBody.textContent = message;
  errUrl.textContent = url || "";
  overlay.classList.add("show");
}

// ---------------------------------------------------------------------------
// Query
// ---------------------------------------------------------------------------
const params = new URLSearchParams(window.location.search);
const modelUrl = params.get("model") || "";

function kindFromUrl(url) {
  const clean = url.split("?")[0].split("#")[0].toLowerCase();
  if (clean.endsWith(".glb")) return "glb";
  if (clean.endsWith(".gltf")) return "gltf";
  if (clean.endsWith(".hdr")) return "hdr";
  if (clean.endsWith(".jpg") || clean.endsWith(".jpeg") || clean.endsWith(".png")) return "image";
  return "";
}

// ---------------------------------------------------------------------------
// Renderer / scene
// ---------------------------------------------------------------------------
function init() {
  renderer = new THREE.WebGLRenderer({
    antialias: true,
    alpha: true,
    powerPreference: "high-performance",
  });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setClearColor(0x000000, 0);
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.0;
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  stage.appendChild(renderer.domElement);

  scene = new THREE.Scene();
  camera = new THREE.PerspectiveCamera(
    55, window.innerWidth / window.innerHeight, 0.05, 4000
  );
  camera.position.set(0, 0.4, 6);

  window.addEventListener("resize", onResize);
  if (!modelUrl) {
    fail("No background file", "The page was opened without a ?model= path.", "");
    hint.textContent = "";
    return;
  }
  const kind = kindFromUrl(modelUrl);
  if (kind === "glb" || kind === "gltf") {
    mode = "scene";
    hint.textContent = "3D background";
    loadScene(modelUrl);
  } else if (kind === "hdr" || kind === "image") {
    mode = "panorama";
    hint.textContent = "360 background";
    loadPanorama(modelUrl, kind);
  } else {
    fail("Unsupported background",
         "Expected a .glb, .gltf, .hdr, .jpg or .png file.", modelUrl);
  }
}

function onResize() {
  if (!renderer || !camera) return;
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
  if (paused) renderFrame(0);
}

// ---------------------------------------------------------------------------
// 3D scene
// ---------------------------------------------------------------------------
function hasLights(root) {
  let found = false;
  root.traverse((node) => { if (node.isLight) found = true; });
  return found;
}

function addStudioLights(radius) {
  const hemi = new THREE.HemisphereLight(0xbcd4ff, 0x141a24, 1.05);
  scene.add(hemi);
  keyLight = new THREE.DirectionalLight(0xffffff, 2.1);
  keyLight.position.set(radius * 1.6, radius * 2.2, radius * 1.4);
  scene.add(keyLight);
  rimLight = new THREE.DirectionalLight(0x7fb4ff, 1.3);
  rimLight.position.set(-radius * 2.0, radius * 0.8, -radius * 1.8);
  scene.add(rimLight);
  fillLight = new THREE.DirectionalLight(0x9fc4ff, 0.55);
  fillLight.position.set(-radius * 0.6, radius * 0.2, radius * 2.0);
  scene.add(fillLight);
}

function loadScene(url) {
  const loader = new GLTFLoader();
  loader.load(
    url,
    (gltf) => {
      try {
        modelRoot = gltf.scene || (gltf.scenes && gltf.scenes[0]);
        if (!modelRoot) {
          fail("Nothing to render", "The file loaded but contains no scene.", url);
          return;
        }
        scene.add(modelRoot);

        const box = new THREE.Box3().setFromObject(modelRoot);
        if (box.isEmpty()) {
          fail("Nothing to render", "The file loaded but has no visible geometry.", url);
          return;
        }
        const size = box.getSize(new THREE.Vector3());
        const center = box.getCenter(new THREE.Vector3());
        modelRoot.position.sub(center);           // centre the scene at the origin
        modelRadius = Math.max(size.x, size.y, size.z) * 0.5 || 1;

        // Frame the whole scene: a fixed camera distance would put a room's
        // walls behind the near plane and a tiny prop a pixel wide.
        baseDistance = modelRadius * 2.25;
        camera.near = Math.max(0.01, modelRadius / 400);
        camera.far = Math.max(200, modelRadius * 60);
        camera.position.set(
          0,
          modelRadius * 0.18,
          baseDistance
        );
        camera.lookAt(0, 0, 0);
        camera.updateProjectionMatrix();

        if (!hasLights(modelRoot)) addStudioLights(modelRadius);
        ready = true;
        hint.textContent = "3D background";
      } catch (err) {
        fail("Could not prepare the scene", String(err && err.message || err), url);
      }
    },
    undefined,
    (err) => {
      const detail = err && (err.message || err.type) ? (err.message || err.type) : "load error";
      fail(
        "Could not load the 3D background",
        "The file or one of its textures/buffers could not be read. A .gltf " +
        "needs its .bin and texture files beside it; a .glb is self-contained. " +
        "Details: " + detail,
        url
      );
    }
  );
}

// ---------------------------------------------------------------------------
// 360 panorama
// ---------------------------------------------------------------------------
function loadPanorama(url, kind) {
  const onTexture = (texture) => {
    try {
      backgroundTexture = texture;
      texture.mapping = THREE.EquirectangularReflectionMapping;
      if (kind === "image") texture.colorSpace = THREE.SRGBColorSpace;
      scene.background = texture;
      scene.environment = texture;
      // A skybox should surround the viewer; any leftover FOV from a scene is
      // irrelevant, but a wide one makes a panorama feel less like a tube.
      camera.fov = 72;
      camera.updateProjectionMatrix();
      camera.position.set(0, 0, 0);
      ready = true;
      hint.textContent = "360 background";
    } catch (err) {
      fail("Could not apply the panorama", String(err && err.message || err), url);
    }
  };
  const onError = (err) => {
    const detail = err && (err.message || err.type) ? (err.message || err.type) : "load error";
    fail(
      "Could not load the 360 background",
      "Expected a 2:1 equirectangular .hdr, .jpg or .png. Details: " + detail,
      url
    );
  };
  if (kind === "hdr") {
    new HDRLoader().load(url, onTexture, undefined, onError);
  } else {
    new THREE.TextureLoader().load(url, onTexture, undefined, onError);
  }
}

// ---------------------------------------------------------------------------
// Hooks (the same seven the other avatar pages expose)
// ---------------------------------------------------------------------------
window.setBrahmaState = function (state) {
  if (!state) return;
  const next = String(state).toUpperCase();
  currentState = Object.prototype.hasOwnProperty.call(STATE_MOTION, next) ? next : "IDLE";
  const motion = STATE_MOTION[currentState];
  speedTarget = motion.speed;
  exposureTarget = motion.exposure;
};

window.setAudioLevel = function (level) {
  audioLevel = Math.max(0.0, Math.min(1.0, parseFloat(level) || 0.0));
};

window.setAvatarEmotion = function (tag, intensity) {
  const raw = String(tag == null ? "" : tag).trim().toUpperCase();
  const known = Object.prototype.hasOwnProperty.call(EMOTION_PROFILES, raw);
  targetEmotion = known ? raw : "NEUTRAL";
  const value = parseFloat(intensity);
  emotionIntensity = Math.max(0.0, Math.min(2.0, isNaN(value) ? 1.0 : value));
  moodHold = known && raw !== "NEUTRAL" ? MOOD_HOLD_SECONDS : 0.0;
  if (!known && raw !== "NEUTRAL") {
    console.warn("setAvatarEmotion: unknown tag refused ->", raw);
  }
  return true;
};

window.setPointerNorm = function (nx, ny) {
  const x = parseFloat(nx), y = parseFloat(ny);
  pointerX = isNaN(x) ? 0 : Math.max(-1, Math.min(1, x));
  pointerY = isNaN(y) ? 0 : Math.max(-1, Math.min(1, y));
};

window.__pauseAnimation = function () { paused = true; };
window.__resumeAnimation = function () { paused = false; clock.getDelta(); };
window.__getAvatarState = function () {
  return {
    mode,
    ready,
    error: loadFailed,
    state: currentState,
    emotion: currentEmotion,
    target: targetEmotion,
    intensity: emotionIntensity,
    weight: emotionWeight,
    hold: moodHold,
    audioLevel,
    reactiveAudio: Math.min(1, smoothedAudio),
    paused,
  };
};

// ---------------------------------------------------------------------------
// Frame loop
// ---------------------------------------------------------------------------
function blendEmotion(dt) {
  if (moodHold > 0) {
    moodHold = Math.max(0, moodHold - dt);
  } else if (currentEmotion !== "NEUTRAL") {
    targetEmotion = "NEUTRAL";
  }
  const targetWeight = targetEmotion === "NEUTRAL" ? 0 : Math.min(1, 0.45 + 0.25 * emotionIntensity);
  emotionWeight += (targetWeight - emotionWeight) * Math.min(1, dt * 3.0);
  currentEmotion = targetEmotion === "NEUTRAL" && emotionWeight < 0.02 ? "NEUTRAL" : targetEmotion;

  const profile = EMOTION_PROFILES[currentEmotion] || EMOTION_PROFILES.NEUTRAL;
  const neutral = EMOTION_PROFILES.NEUTRAL;
  const lerp = (a, b) => a + (b - a) * emotionWeight;
  const hot = new THREE.Color(neutral.hot).lerp(new THREE.Color(profile.hot), emotionWeight);
  const mid = new THREE.Color(neutral.mid).lerp(new THREE.Color(profile.mid), emotionWeight);
  currentColor = { hot, mid };
  if (keyLight) keyLight.color.copy(hot);
  if (rimLight) rimLight.color.copy(mid);
  if (fillLight) fillLight.color.copy(mid);
}

function renderFrame(dt) {
  elapsed += dt;
  smoothedAudio += (audioLevel - smoothedAudio) * Math.min(1, dt * 6.0);
  smoothPointerX += (pointerX - smoothPointerX) * Math.min(1, dt * 2.4);
  smoothPointerY += (pointerY - smoothPointerY) * Math.min(1, dt * 2.4);
  speedNow += (speedTarget - speedNow) * Math.min(1, dt * 2.0);
  exposureNow += (exposureTarget - exposureNow) * Math.min(1, dt * 2.0);
  blendEmotion(dt);

  const profile = EMOTION_PROFILES[currentEmotion] || EMOTION_PROFILES.NEUTRAL;
  const audioEnergy = smoothedAudio * profile.audio;
  if (renderer) {
    renderer.toneMappingExposure = exposureNow * (1.0 + audioEnergy * 0.10);
  }

  if (mode === "scene" && camera) {
    const orbit = Math.sin(elapsed * speedNow * 0.55) * 0.30;
    const bob = Math.sin(elapsed * speedNow * 0.37) * 0.05 * modelRadius;
    const dist = baseDistance * (1.0 - audioEnergy * 0.055);
    camera.position.set(
      Math.sin(orbit) * dist + smoothPointerX * modelRadius * 0.10,
      modelRadius * 0.18 + bob + smoothPointerY * modelRadius * 0.07,
      Math.cos(orbit) * dist
    );
    camera.lookAt(0, bob * 0.5, 0);
  } else if (mode === "panorama" && camera) {
    // Rotate the view instead of the skybox: an equirect texture is sampled by
    // direction, so turning the camera is the correct "look around".
    camera.rotation.order = "YXZ";
    camera.rotation.y = Math.sin(elapsed * speedNow * 0.5) * 0.16
      + smoothPointerX * 0.18;
    camera.rotation.x = smoothPointerY * 0.10;
    camera.rotation.z = 0;
  }

  if (renderer && scene && camera) renderer.render(scene, camera);
}

function loop() {
  requestAnimationFrame(loop);
  if (!renderer || loadFailed) return;
  const dt = Math.min(0.05, clock.getDelta());   // clamp: a hidden tab or a
                                                 // stalled GUI must not teleport
  if (!paused) renderFrame(dt);
}

// ---------------------------------------------------------------------------
// Boot
// ---------------------------------------------------------------------------
try {
  init();
  loop();
} catch (err) {
  fail("Background renderer failed", String(err && err.message || err), modelUrl);
}
</script>
</body>
</html>
