<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Brahma Evo - Live2D avatar</title>
<style>
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    background: #020306; overflow: hidden;
  }
  #stage { position: absolute; inset: 0; }
  #stage canvas { display: block; width: 100%; height: 100%; }
  #boot {
    position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
    max-width: 60ch; text-align: center; pointer-events: none;
    font: 13px/1.55 "Segoe UI", system-ui, sans-serif;
    color: #7fa8c8; text-shadow: 0 1px 3px #000;
  }
  #boot b { color: #dff0ff; font-weight: 600; }
  #boot .hint { color: #4d6b83; font-size: 11px; margin-top: 8px; }
  #boot.hidden { display: none; }
</style>
</head>
<body>
<div id="stage"></div>
<div id="boot">
  <b>Live2D avatar</b>
  <div id="boot-detail">starting...</div>
</div>
<script>
"use strict";
/*
 * Live2D avatar host.
 *
 * The page is intentionally thin: all Cubism work lives in the vendored
 * runtime under vendor/ (see scripts/setup_live2d_cubism.ps1). This script
 * only wires that runtime to one canvas and exposes the fixed host-hook
 * contract the Brahma app drives.
 *
 * Query parameters:
 *   ?model=<file url or path>  folder that contains <Name>.model3.json
 *   ?name=<Name>               optional explicit model basename
 */
(function () {
  var VENDOR_CORE = "vendor/live2dcubismcore.min.js";
  var VENDOR_FRAMEWORK = "vendor/framework.js";

  var EMOTION_EXPRESSION = {
    NEUTRAL: null,
    JOY: "exp_02",
    SMILE: "exp_02",
    SORROW: "exp_04",
    ANGER: null,
    FUN: "exp_03",
    SURPRISE: "exp_05",
    THINKING: null,
    CALM: null,
    EXCITED: null,
    CONFUSED: null,
    LOVE: null,
    TIRED: null
  };
  // Parameters applied when an emotion has no expression file (or to reinforce
  // one). Ids that the loaded model does not expose are skipped at runtime, so
  // the same table is safe across models.
  var EMOTION_PARAMS = {
    NEUTRAL: {},
    JOY: { ParamMouthForm: 1.0, ParamEyeLOpen: 0.6, ParamEyeROpen: 0.6, ParamBrowLY: 0.6, ParamBrowRY: 0.6 },
    SMILE: { ParamMouthForm: 1.0, ParamEyeLOpen: 0.7, ParamEyeROpen: 0.7 },
    SORROW: { ParamMouthForm: -1.0, ParamBrowLY: -1.0, ParamBrowRY: -1.0, ParamEyeLOpen: 0.3, ParamEyeROpen: 0.3 },
    ANGER: { ParamMouthForm: -1.0, ParamBrowLY: 1.0, ParamBrowRY: 1.0 },
    FUN: { ParamMouthForm: 1.0, ParamEyeLOpen: 0.6, ParamEyeROpen: 0.6, ParamBrowLY: 0.4, ParamBrowRY: 0.4 },
    SURPRISE: { ParamMouthForm: 1.0, ParamEyeLOpen: 1.0, ParamEyeROpen: 1.0, ParamBrowLY: 0.8, ParamBrowRY: 0.8 },
    THINKING: { ParamMouthForm: -0.3, ParamBrowLY: 0.5, ParamBrowRY: -0.5, ParamEyeLOpen: 0.7, ParamEyeROpen: 0.7, ParamAngleZ: 6.0 },
    CALM: { ParamMouthForm: 0.3, ParamEyeLOpen: 0.55, ParamEyeROpen: 0.55, ParamBrowLY: -0.2, ParamBrowRY: -0.2 },
    EXCITED: { ParamMouthForm: 1.0, ParamMouthOpenY: 0.6, ParamEyeLOpen: 1.0, ParamEyeROpen: 1.0, ParamBrowLY: 0.8, ParamBrowRY: 0.8, ParamBodyAngleZ: 4.0 },
    CONFUSED: { ParamMouthForm: -0.4, ParamEyeLOpen: 0.7, ParamEyeROpen: 0.7, ParamBrowLY: 0.5, ParamBrowRY: -0.5, ParamAngleZ: 9.0 },
    LOVE: { ParamMouthForm: 1.0, ParamEyeLOpen: 0.45, ParamEyeROpen: 0.45, ParamBrowLY: 0.4, ParamBrowRY: 0.4, ParamCheek: 1.0 },
    TIRED: { ParamMouthForm: -0.3, ParamEyeLOpen: 0.2, ParamEyeROpen: 0.2, ParamBrowLY: 0.3, ParamBrowRY: 0.3 }
  };
  var SDK_DOWNLOAD_URL = "https://www.live2d.com/en/sdk/download/web/";
  var EMOTION_HOLD_SECONDS = 7.0;
  var LIPSYNC_GAIN = 0.9;

  var BOOT = document.getElementById("boot");
  var BOOT_DETAIL = document.getElementById("boot-detail");
  var STAGE = document.getElementById("stage");

  var params = new URLSearchParams(window.location.search);
  var MODEL_DIR = params.get("model") || "";
  var MODEL_NAME = params.get("name") || "";
  var MODEL_URL_BASE = "";

  if (MODEL_DIR) {
    var base = MODEL_DIR.replace(/\\/g, "/").replace(/\/?$/, "/");
    MODEL_URL_BASE = new URL(base, window.location.href).href;
  }

  // Chromium cannot fetch() file:// URLs, but the Cubism framework loads the
  // model, physics, and shaders through fetch(). Bridge file:// through
  // XMLHttpRequest, which the WebEngine is configured to allow locally.
  if (typeof window.fetch !== "function" || location.protocol === "file:") {
    var nativeFetch = window.fetch;
    window.fetch = function (input, init) {
      var url = typeof input === "string" ? input : (input && input.url);
      if (location.protocol === "file:" && url && url.indexOf("file://") === 0) {
        return new Promise(function (resolve, reject) {
          var xhr = new XMLHttpRequest();
          xhr.open("GET", url, true);
          xhr.responseType = "arraybuffer";
          xhr.onload = function () {
            if ((xhr.status >= 200 && xhr.status < 300) || xhr.status === 0) {
              resolve(new Response(xhr.response, { status: 200, statusText: "OK" }));
            } else {
              reject(new Error("fetch failed " + xhr.status + " " + url));
            }
          };
          xhr.onerror = function () { reject(new Error("fetch error " + url)); };
          xhr.send();
        });
      }
      if (typeof nativeFetch === "function") { return nativeFetch.apply(this, arguments); }
      return Promise.reject(new Error("No fetch available for " + url));
    };
  }

  var state = {
    emotion: "NEUTRAL",
    intensity: 1.0,
    hold: 0.0,
    weight: 0.0,
    ready: false,
    error: "",
    paused: false,
    audioLevel: 0.0,
    pointer: { x: 0, y: 0 },
    brahmaState: "IDLE",
    modelUrl: ""
  };

  var app = null;      // { LCF, canvas, model, glManager, CubismMatrix44, LAppPal, Offscreen }
  var lastTick = 0;

  function bootFail(title, detail, hint) {
    state.ready = false;
    state.error = detail || title;
    BOOT_DETAIL.innerHTML = "";
    var b = document.createElement("b");
    b.textContent = title;
    BOOT_DETAIL.appendChild(b);
    if (detail) {
      var d = document.createElement("div");
      d.textContent = detail;
      BOOT_DETAIL.appendChild(d);
    }
    if (hint) {
      var h = document.createElement("div");
      h.className = "hint";
      h.textContent = hint;
      BOOT_DETAIL.appendChild(h);
    }
    BOOT.classList.remove("hidden");
    console.warn("[Live2D] " + title + ": " + (detail || ""));
  }

  function loadScript(src) {
    return new Promise(function (resolve, reject) {
      var s = document.createElement("script");
      s.src = src;
      s.onload = function () { resolve(src); };
      s.onerror = function () { reject(new Error("could not load " + src)); };
      document.head.appendChild(s);
    });
  }

  function deriveModelFileName() {
    if (MODEL_NAME) { return MODEL_NAME.replace(/\.model3\.json$/, "") + ".model3.json"; }
    var parts = MODEL_URL_BASE.split("/").filter(Boolean);
    var name = parts[parts.length - 1] || parts[parts.length - 2] || "model";
    return name.replace(/\.model3\.json$/, "") + ".model3.json";
  }

  async function boot() {
    if (window._live2dBooted) { return; }
    window._live2dBooted = true;

    if (!MODEL_URL_BASE) {
      bootFail("No Live2D model folder",
        "expected ?model=<folder url>",
        "Settings -> Avatar -> Live2D");
      return;
    }

    try {
      await loadScript(VENDOR_CORE);
      await loadScript(VENDOR_FRAMEWORK);
    } catch (e) {
      bootFail("runtime not installed", String(e.message || e),
        "run scripts/setup_live2d_cubism.ps1, or download the SDK from " + SDK_DOWNLOAD_URL);
      return;
    }

    if (typeof window.Live2DCubismCore === "undefined" ||
        typeof window.Live2DCubismFramework === "undefined") {
      bootFail("runtime loaded but missing globals",
        "Live2DCubismCore / Live2DCubismFramework not found");
      return;
    }

    var settingName = deriveModelFileName();
    try {
      await ensureModelFile(settingName);
    } catch (e) {
      bootFail("the model file could not be read", String(e.message || e),
        MODEL_URL_BASE + settingName);
      return;
    }

    try {
      startModel(settingName);
    } catch (e) {
      bootFail("model init failed", String(e.message || e), MODEL_URL_BASE);
    }
  }

  // The page derives the model file name from the folder it was handed. A
  // mismatch used to sit on "starting..." forever, because the sample's
  // loadAssets is fire-and-forget. Reading the setting first names the failure
  // and proves the file:// fetch bridge works before the runtime leans on it.
  function ensureModelFile(fileName) {
    var url = MODEL_URL_BASE + fileName;
    return window.fetch(url, { cache: "no-store" }).then(function (resp) {
      if (!resp.ok) { throw new Error("HTTP " + resp.status + " for " + url); }
      return resp.text();
    }).then(function (text) {
      try { JSON.parse(text); }
      catch (e) { throw new Error("not a JSON model setting: " + url); }
      return true;
    });
  }

  function startModel(settingName) {
    var LCF = window.Live2DCubismFramework;
    var LAppDefine = LCF.LAppDefine;

    // startUp() hands s_option.logFunction straight to the core's
    // csmSetLogFunction(). Omit it and the core's logger is nulled, so the very
    // first core log - emitted during CubismMoc.create()'s consistency check -
    // throws "Logging.logFunction is not a function" and aborts the load chain.
    // The model then never reaches a renderer and the page hangs on startup.
    LCF.CubismFramework.startUp({
      loggingLevel: LAppDefine.CubismLoggingLevel,
      logFunction: function (message) {
        if (window.console && console.log) { console.log("[Live2D] " + message); }
      }
    });
    LCF.CubismFramework.initialize();

    var canvas = document.createElement("canvas");
    STAGE.appendChild(canvas);

    var glManager = new LCF.LAppGlManager();
    if (!glManager.initialize(canvas)) {
      throw new Error("WebGL2 is not available");
    }
    var textureManager = new LCF.LAppTextureManager();
    textureManager.setGlManager(glManager);

    var subdelegate = new LCF.LAppSubdelegate(canvas, glManager, textureManager);
    subdelegate.setFrameBuffer(null);

    var model = new LCF.LAppModel();
    model.setSubdelegate(subdelegate);

    state.modelUrl = MODEL_URL_BASE + settingName;
    model.loadAssets(MODEL_URL_BASE, settingName);

    app = {
      LCF: LCF,
      canvas: canvas,
      model: model,
      glManager: glManager,
      CubismMatrix44: LCF.CubismMatrix44,
      LAppPal: LCF.LAppPal,
      Offscreen: LCF.CubismWebGLOffscreenManager
    };

    resizeCanvas();
    window.addEventListener("resize", resizeCanvas);
    lastTick = performance.now();
    window.requestAnimationFrame(loop);

    // The sample's loadAssets does not report failure, so a model that never
    // arrives would sit on "starting..." indefinitely. Name it instead.
    app.readyDeadline = window.setTimeout(function () {
      if (!state.ready && !state.error) {
        bootFail("the model did not finish loading",
          "no frame was drawn within 20s - the runtime loaded but no model appeared",
          state.modelUrl || MODEL_URL_BASE);
      }
    }, 20000);
  }

  function resizeCanvas() {
    if (!app) { return; }
    var canvas = app.canvas;
    var dpr = window.devicePixelRatio || 1;
    var w = Math.max(1, Math.round(canvas.clientWidth * dpr));
    var h = Math.max(1, Math.round(canvas.clientHeight * dpr));
    if (canvas.width !== w || canvas.height !== h) {
      canvas.width = w;
      canvas.height = h;
    }
  }

  function loop() {
    var now = performance.now();
    var delta = (now - lastTick) / 1000.0;
    lastTick = now;
    if (!state.paused) {
      try {
        tick(delta > 0 && delta < 0.5 ? delta : 1 / 60);
      } catch (err) {
        state.ready = false;
        state.error = "Renderer stopped: " +
          (err && err.message ? err.message : String(err));
        bootFail("Renderer stopped", state.error, "see the developer console");
        console.error("Renderer stopped", err);
        return;
      }
    }
    window.requestAnimationFrame(loop);
  }

  function tick(delta) {
    if (!app || !app.model.getModel()) { return; }

    // Emotion blend + auto-return to neutral.
    if (state.hold > 0) {
      state.hold = Math.max(0, state.hold - delta);
      if (state.hold === 0) { state.emotion = "NEUTRAL"; }
    }
    var target = state.emotion === "NEUTRAL"
      ? 0.0
      : Math.max(0, Math.min(1, state.intensity / 2));
    state.weight += (target - state.weight) * (target > state.weight ? 0.18 : 0.05);
    if (target === 0 && state.weight < 0.002) { state.weight = 0; }

    var canvas = app.canvas;
    var model = app.model;
    var gl = app.glManager.getGl();

    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    gl.viewport(0, 0, gl.drawingBufferWidth, gl.drawingBufferHeight);
    gl.clearColor(0, 0, 0, 1);
    gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
    gl.enable(gl.BLEND);
    gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);

    app.LAppPal.updateTime();

    app.Offscreen.getInstance().beginFrameProcess(gl);

    model.update();

    var cubismModel = model.getModel();
    if (!EMOTION_EXPRESSION[state.emotion]) {
      applyEmotionParams(cubismModel);
    }

    var projection = new app.CubismMatrix44();
    if (cubismModel.getCanvasWidth() > 1.0 && canvas.width < canvas.height) {
      cubismModel.getModelMatrix().setWidth(2.0);
      projection.scale(1.0, canvas.width / canvas.height);
    } else {
      projection.scale(canvas.height / canvas.width, 1.0);
    }
    model.draw(projection);

    var offscreen = app.Offscreen.getInstance();
    offscreen.endFrameProcess(gl);
    offscreen.releaseStaleRenderTextures(gl);

    if (!state.ready && model.getRenderer()) {
      state.ready = true;
      state.error = "";
      if (app && app.readyDeadline) {
        window.clearTimeout(app.readyDeadline);
        app.readyDeadline = 0;
      }
      BOOT.classList.add("hidden");
    }
  }

  // --- Host hook contract ---------------------------------------------------
  // These names are fixed: the Brahma app calls them via QWebEngine runJavaScript.

  function applyExpression() {
    if (!app) { return; }
    var name = EMOTION_EXPRESSION[state.emotion];
    if (name && typeof app.model.setExpression === "function") {
      try { app.model.setExpression(name); } catch (e) {}
    }
  }

  // CubismIdManager.getId() registers unknown ids, so existence must be checked
  // with isExist() first; an absent parameter resolves to null and is skipped.
  function resolveParameterId(idManager, name) {
    var resolved = idManager.isExist(name) ? idManager.getId(name) : undefined;
    return (resolved === undefined || resolved === null) ? null : resolved;
  }

  function applyEmotionParams(cubismModel) {
    var overrides = EMOTION_PARAMS[state.emotion];
    if (!overrides || !cubismModel) { return; }
    var idManager = app.LCF.CubismFramework.getIdManager();
    for (var name in overrides) {
      if (!Object.prototype.hasOwnProperty.call(overrides, name)) { continue; }
      var id = resolveParameterId(idManager, name);
      if (id === null) { continue; }
      cubismModel.setParameterValueById(id, overrides[name], 1.0);
    }
  }

  window.setAvatarEmotion = function (tag, intensity) {
    var raw = String(tag == null ? "" : tag).trim().toUpperCase();
    var known = Object.prototype.hasOwnProperty.call(EMOTION_EXPRESSION, raw);
    state.emotion = known ? raw : "NEUTRAL";
    var i = parseFloat(intensity);
    state.intensity = isNaN(i) ? 1.0 : Math.max(0, Math.min(2, i));
    state.hold = known && raw !== "NEUTRAL" ? EMOTION_HOLD_SECONDS : 0;
    applyExpression();
    return true;
  };

  window.setAudioLevel = function (level) {
    var v = parseFloat(level);
    state.audioLevel = isNaN(v) ? 0 : Math.max(0, Math.min(1, v));
    if (!app) { return; }
    try {
      var cubismModel = app.model.getModel();
      if (cubismModel && cubismModel.setParameterValueById) {
        var id = app.LCF.CubismFramework.getIdManager().getId("ParamMouthOpenY");
        cubismModel.setParameterValueById(id, LIPSYNC_GAIN * state.audioLevel, 0.8);
      }
    } catch (e) {}
  };

  window.setPointerNorm = function (nx, ny) {
    var x = Number(nx), y = Number(ny);
    state.pointer.x = isNaN(x) ? 0 : x;
    state.pointer.y = isNaN(y) ? 0 : y;
    if (app && typeof app.model.setDragging === "function") {
      try { app.model.setDragging(state.pointer.x * 20, state.pointer.y * 20); } catch (e) {}
    }
  };

  window.setBrahmaState = function (name) {
    state.brahmaState = String(name || "IDLE").toUpperCase();
    if (state.brahmaState === "SPEAKING" && state.audioLevel < 0.05) {
      window.setAudioLevel(0.05);
    }
  };

  window.__pauseAnimation = function () { state.paused = true; };
  window.__resumeAnimation = function () { state.paused = false; };
  window.__isAnimationPaused = function () { return state.paused; };

  window.__getAvatarState = function () {
    return {
      backend: "live2d",
      ready: state.ready,
      error: state.error,
      emotion: state.emotion,
      intensity: state.intensity,
      weight: state.weight,
      mouthOpen: LIPSYNC_GAIN * state.audioLevel,
      paused: state.paused,
      modelUrl: state.modelUrl
    };
  };

  if (document.readyState === "complete" || document.readyState === "interactive") {
    boot();
  } else {
    document.addEventListener("DOMContentLoaded", boot);
  }
})();
</script>
</body>
</html>
