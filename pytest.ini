[pytest]
# Only the real test suite is pytest-collected. The repo root also holds
# demonstration runners (test_self_heal.py, test_local_brain.py,
# test_sensorium_live.py) and actions/test_action.py, which is an intentional
# ZeroDivisionError fixture for the self-healing demo -- collecting those made a
# bare `pytest` fail with an error that had nothing to do with the tests.
testpaths = tests
