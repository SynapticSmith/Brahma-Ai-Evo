name: Build

# Packaging is deliberately NOT part of the push/PR gate: a PyInstaller build
# needs the full Windows runtime stack (PyQt6-WebEngine, mediapipe, pyaudio-adjacent
# wheels) and takes far longer than the test suite. This workflow exists so a
# release artifact can be produced from a clean clone on demand, with the exact
# pinned toolchain from requirements-build.txt, and with hashes attached.
#
# Run it from the Actions tab ("Run workflow") or push a v* tag.

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    name: PyInstaller build (Windows, 3.11)
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            requirements-build.txt

      - name: Install runtime + build requirements
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-build.txt

      - name: Verify the pinned toolchain
        run: |
          python -c "import sys; assert sys.version_info[:2] == (3, 11), sys.version"
          python -m PyInstaller --version

      - name: Build application and setup wizard
        run: python -m PyInstaller installer\BrahmaEvo.spec --noconfirm
        # build_all.ps1 uses .venv by design for local work; on CI the runner
        # interpreter is already the pinned 3.11, so invoke the steps directly.
      - name: Build setup wizard
        run: python -m PyInstaller installer\BrahmaEvo_Setup.spec --noconfirm

      - name: Write checksums
        run: |
          $artifacts = @("dist\BrahmaEvo\BrahmaEvo.exe", "dist\BrahmaEvo_Setup.exe")
          $lines = foreach ($a in $artifacts) {
            if (-not (Test-Path $a)) { throw "missing artifact: $a" }
            $h = (Get-FileHash -Algorithm SHA256 -Path $a).Hash.ToLower()
            "$h  $(Split-Path -Leaf $a)"
          }
          $lines | Set-Content -Path dist\SHA256SUMS.txt -Encoding ascii
          $lines

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: brahma-evo-windows-x64
          path: |
            dist\BrahmaEvo_Setup.exe
            dist\SHA256SUMS.txt
          if-no-files-found: error

# Honest limits, so nobody mistakes this for a signed release:
#   - the setup exe is unsigned (codesign_identity=None, no signtool step)
#   - the build is not bit-for-bit reproducible (top-level pins only, no lock)
#   - the runner's wheel resolution is whatever PyPI serves that day
# WS-6 (signed, staged, reversible updates) covers closing those.
