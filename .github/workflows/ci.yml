name: CI

# The stack is Windows-only (PyQt6, pywin32/comtypes/pycaw, SAPI, a real mic for
# the wake-word harness), so the runner is windows-latest and only the portable
# unit suite is executed here. The accept_*.py harnesses need a display and audio
# devices and stay a local/manual gate via scripts/precommit_check.py.

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  static-gate:
    name: Static gate (secrets / licences / large files)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # No dependency install: precommit_check.py --quick is stdlib-only and is
      # the same gate installed as the local pre-commit hook.
      - name: Run the static pre-commit gate
        run: python scripts/precommit_check.py --quick

  lint:
    name: Ruff lint
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dev tooling
        run: python -m pip install --upgrade pip -r requirements-dev.txt
      - name: Ruff check
        run: python -m ruff check .

  tests:
    name: Unit suite
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      # Runtime deps (PyQt6, pywin32, mcp, ...) plus the dev tooling that
      # provides pytest. requirements.txt alone is not enough: the suite
      # imports the app, and tests/conftest.py bootstraps the Qt runtime.
      - name: Install dependencies
        run: python -m pip install --upgrade pip -r requirements.txt -r requirements-dev.txt
      - name: Run pytest
        env:
          # Qt widgets are exercised headlessly; no display exists on the runner.
          QT_QPA_PLATFORM: offscreen
          NO_COLOR: "1"
        run: python -m pytest tests -q

  harness-pythons:
    name: Harness on Python ${{ matrix.python-version }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.11 is the floor (the pinned runtime stack has no older wheels);
        # 3.12/3.13 prove the stdlib-only harness does not rely on 3.11
        # implementation details. The CLI is stdlib, so no requirements.txt.
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install test tooling
        run: python -m pip install --upgrade pip pytest cryptography
      - name: Harness, Red-Team & Security suite
        env:
          NO_COLOR: "1"
        # bash so the glob expands: only the portable harness and security tests
        # are collected without requiring PyQt6 or display devices.
        shell: bash
        run: python -m pytest tests/test_agent_*.py tests/test_redteam.py tests/test_audit_log.py tests/test_capabilities.py tests/test_secret_broker.py tests/test_release_manager.py tests/test_plugin_store.py tests/test_taint_policy.py tests/test_tool_policy.py tests/test_key_rotation_drill.py tests/test_skill_store.py tests/test_skill_host.py -q
      - name: CLI smoke run
        run: python -m agent run "say hello" --provider stub --json --no-session
      - name: Verify SBOM generation
        run: python scripts/generate_sbom.py --verify
